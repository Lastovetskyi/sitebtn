name: Публікація на хостинг

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FTP_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Відправити файли на хостинг
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            tools/**
            panel/**
            CNAME
            *.zip
            DEPLOY.md
            README.md
            llmaudit.py
            report.json
